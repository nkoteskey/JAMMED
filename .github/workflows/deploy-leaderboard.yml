# Deploys the online leaderboard (server/leaderboard-worker.js) to
# Cloudflare Workers and writes its URL into leaderboard.json so the game
# picks it up on the next Pages publish. Free tier is enough.
#
# One-time setup (about five minutes):
#   1. Cloudflare dashboard -> My Profile -> API Tokens -> Create Token ->
#      template "Edit Cloudflare Workers" -> Continue -> Create Token.
#   2. Cloudflare dashboard -> Workers & Pages -> copy the Account ID
#      from the right-hand column.
#   3. GitHub repo -> Settings -> Secrets and variables -> Actions ->
#      New repository secret: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
#   4. Actions tab -> "Deploy leaderboard" -> Run workflow.
# The run creates the KV namespace if needed, deploys the worker, commits
# leaderboard.json with the worker URL, and the Pages workflow republishes.
name: Deploy leaderboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-leaderboard.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets first (see the comment at the top of this workflow)."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wrangler
        run: npm i -g wrangler@3

      - name: Create KV namespace if missing
        id: kv
        working-directory: server
        run: |
          set -e
          LIST=$(wrangler kv namespace list)
          ID=$(echo "$LIST" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const n=l.find(x=>x.title.endsWith("SCORES"));console.log(n?n.id:"")})')
          if [ -z "$ID" ]; then
            OUT=$(wrangler kv namespace create SCORES)
            ID=$(echo "$OUT" | grep -oE 'id = "[0-9a-f]+"' | grep -oE '[0-9a-f]{32}')
          fi
          echo "KV namespace id: $ID"
          sed -i "s/__KV_ID__/$ID/" wrangler.toml
          cat wrangler.toml

      - name: Deploy worker
        working-directory: server
        run: wrangler deploy

      - name: Resolve worker URL
        id: url
        run: |
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{console.log(JSON.parse(s).result.subdomain)})')
          URL="https://jammed-leaderboard.$SUB.workers.dev"
          echo "Leaderboard URL: $URL"
          curl -sf "$URL/top?limit=1" >/dev/null && echo "API responds." || echo "::warning::API did not respond yet (DNS can take a minute)."
          printf '{ "url": "%s" }\n' "$URL" > leaderboard.json
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Commit leaderboard.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leaderboard.json
          if git diff --cached --quiet; then
            echo "leaderboard.json unchanged"
          else
            git commit -m "Point the game at the deployed leaderboard (${{ steps.url.outputs.url }})"
            git push
          fi
