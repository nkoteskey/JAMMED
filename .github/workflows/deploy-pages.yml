# Publishes the game to GitHub Pages so it is playable at
# https://nkoteskey.github.io/JAMMED/
#
# The static game files are pushed to the `gh-pages` branch, which GitHub
# Pages serves. Runs on every push to main (and on the improvement branch
# while its pull request is open), or by hand from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/modest-galileo-5mklc8
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site files
        # The game is static: ship everything except source art (.xcf) and
        # Tiled project files the browser never loads.
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' \
            --exclude '*.xcf' --exclude '*.tmx' --exclude '*.tmj' \
            ./ _site/
          touch _site/.nojekyll

      - name: Stamp script URLs with the commit
        # Browsers cache each script separately, so after a deploy a visitor
        # could get a new index.html with old scripts (or the reverse) and
        # see half an update: missing stages, a jukebox row that never
        # renders. A per-commit query string makes every deploy fetch a
        # matching set.
        run: |
          V="${GITHUB_SHA::10}"
          sed -i -E "s#(src=\"(js|includes)/[^\"?]+\.js)\"#\1?v=$V\"#g" _site/index.html
          grep -c "?v=$V" _site/index.html

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publish ${{ github.sha }}"
